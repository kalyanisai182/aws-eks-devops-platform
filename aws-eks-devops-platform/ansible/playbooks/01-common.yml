---
# Base OS preparation required by Kubernetes: packages, swap off, kernel modules, sysctl.
- name: Prepare all Kubernetes nodes
  hosts: k8s
  become: true

  tasks:
    - name: Set hostname to inventory name
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Install base packages
      ansible.builtin.apt:
        name: [apt-transport-https, ca-certificates, curl, gnupg, jq, unzip, chrony]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Disable swap now
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb | int > 0
      changed_when: true

    - name: Disable swap permanently
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Load kernel modules on boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: "0644"

    - name: Load kernel modules now
      ansible.builtin.command: "modprobe {{ item }}"
      loop: [overlay, br_netfilter]
      changed_when: false

    - name: Set Kubernetes sysctl parameters
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
        mode: "0644"
      notify: Reload sysctl

    - name: Ensure time sync is running
      ansible.builtin.service:
        name: chrony
        state: started
        enabled: true

  handlers:
    - name: Reload sysctl
      ansible.builtin.command: sysctl --system
      changed_when: true
