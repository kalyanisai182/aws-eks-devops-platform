---
# Optional: configures the Jenkins server created by Terraform (jenkins_enabled = true).
# Run: ansible-playbook playbooks/05-jenkins-server.yml
- name: Configure Jenkins build server
  hosts: jenkins
  become: true

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg, unzip, python3-venv, python3-pip, openjdk-17-jre, docker.io]
        state: present
        update_cache: true

    - name: Add Jenkins apt key
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key
        dest: /usr/share/keyrings/jenkins-keyring.asc
        mode: "0644"

    - name: Add Jenkins apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        state: present

    - name: Install Jenkins
      ansible.builtin.apt:
        name: jenkins
        state: present
        update_cache: true

    - name: Let Jenkins use Docker
      ansible.builtin.user:
        name: jenkins
        groups: docker
        append: true

    - name: Install AWS CLI v2  # noqa command-instead-of-module
      ansible.builtin.shell: |
        curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
        unzip -q -o /tmp/awscliv2.zip -d /tmp
        /tmp/aws/install --update
      args:
        creates: /usr/local/bin/aws

    - name: Install kubectl  # noqa command-instead-of-module
      ansible.builtin.shell: |
        curl -sSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/$(curl -sSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x /usr/local/bin/kubectl
      args:
        creates: /usr/local/bin/kubectl

    - name: Ensure Jenkins is running and enabled
      ansible.builtin.service:
        name: jenkins
        state: started
        enabled: true
